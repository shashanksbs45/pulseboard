{{- /* Fails the render when no ingest token source is configured. */}}
{{- $_ := include "pulseboard.tokenSecretName" . }}
{{- if include "pulseboard.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulseboard.fullname" . }}
  labels:
    {{- include "pulseboard.labels" . | nindent 4 }}
type: Opaque
data:
  ingest-token: {{ .Values.ingestToken | b64enc | quote }}
{{- end }}
