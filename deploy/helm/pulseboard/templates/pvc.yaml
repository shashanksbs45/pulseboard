apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pulseboard.fullname" . }}-data
  labels:
    {{- include "pulseboard.labels" . | nindent 4 }}
  annotations:
    # Keep metric data on `helm uninstall`; a reinstall with the same release
    # name and namespace adopts this claim again.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
