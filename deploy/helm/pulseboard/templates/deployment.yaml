apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulseboard.fullname" . }}
  labels:
    {{- include "pulseboard.labels" . | nindent 4 }}
spec:
  # SQLite has a single writer: never run more than one pod, and let the old pod
  # release the volume before a new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pulseboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pulseboard.selectorLabels" . | nindent 8 }}
      {{- if or .Values.podAnnotations (include "pulseboard.createSecret" .) }}
      annotations:
        {{- if include "pulseboard.createSecret" . }}
        # Rolls the pod when the chart-managed token changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      # Longer than the server's 10s drain, so in-flight requests finish and the
      # database closes before SIGKILL.
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Makes a freshly provisioned volume writable by the server.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pulseboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PULSEBOARD_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulseboard.tokenSecretName" . }}
                  key: {{ include "pulseboard.tokenSecretKey" . }}
            {{- with .Values.retention }}
            - name: PULSEBOARD_RETENTION
              value: {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "pulseboard.fullname" . }}-data
        # The root filesystem is read-only; SQLite may need a temp directory.
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
