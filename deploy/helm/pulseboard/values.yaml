# Image to run. The defaults match `docker build -t pulseboard:dev .` followed by
# `minikube image load pulseboard:dev`;
# point these at a registry for other clusters.
image:
  repository: pulseboard
  tag: dev
  pullPolicy: IfNotPresent

# Secrets for pulling the image from a private registry, in the pod spec's
# format. Create one with `kubectl create secret docker-registry`, e.g.
#   imagePullSecrets:
#     - name: regcred
imagePullSecrets: []

# Bearer token for the ingest endpoint. Set this or existingSecret; the install
# fails if neither is set. The chart stores this value in a Secret it creates,
# and Helm keeps it in the release record, so prefer existingSecret beyond
# local use.
ingestToken: ""

# Name of a Secret you manage that holds the ingest token. When set, it is used
# instead of ingestToken and the chart creates no Secret. The server reads the
# token only at startup and the chart can't see this Secret's contents, so after
# rotating the token restart the pod with `kubectl rollout restart deployment/<name>`
# (the release name, or <release>-pulseboard if it lacks "pulseboard").
existingSecret: ""
# Key inside existingSecret that holds the token. Empty means ingest-token.
existingSecretKey: ingest-token

# How long raw points are kept, as a Go duration (e.g. 720h). Empty keeps the
# server's default (168h).
retention: ""

service:
  type: ClusterIP
  port: 8080

# The SQLite database lives on this claim. It is kept on `helm uninstall`, so
# reinstalling the same release reuses the data.
persistence:
  size: 1Gi
  # Empty uses the cluster's default StorageClass.
  storageClass: ""

resources: {}

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
